# bb2dash Phase 25a, W-100, PROBE ONLY. A throwaway compose project of its own:
#
#   docker compose -p bb2dash-p25probe -f docker/egress/compose.probe.yaml ...
#
# Its own two networks, its own two images (tags end :p25-probe), no secret, no volume, nothing of
# the live stack. probe-inside is internal: the client's only way out is the proxy.
name: bb2dash-p25probe

services:
  egress:
    build:
      context: .
      dockerfile: Dockerfile
    image: bb2dash-egress:p25-probe
    networks:
      probe-inside: {}
      probe-outside: {}

  probe-client:
    build:
      context: .
      dockerfile: Dockerfile.client
    image: bb2dash-egress-client:p25-probe
    networks:
      probe-inside: {}
    environment:
      HOME: /tmp/probe-home
      CLAUDE_CONFIG_DIR: /tmp/probe-home/.claude
      # The live workspace service's settings, so P-1 sees the hosts the live CLI would.
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
      DISABLE_AUTOUPDATER: "1"

networks:
  probe-inside:
    internal: true
    ipam:
      config:
        - subnet: 10.250.25.0/24
  probe-outside:
    ipam:
      config:
        - subnet: 10.250.26.0/24
