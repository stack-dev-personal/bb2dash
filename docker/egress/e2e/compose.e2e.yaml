# bb2dash Phase 25a, W-100: the end-to-end test's overrides, read after compose.yaml:
#
#   docker compose -p bb2dash-p25egress -f compose.yaml -f docker/egress/e2e/compose.e2e.yaml \
#     --profile workspace --profile apply <command> <service>...
#
# run-e2e.sh is the only caller. Every image gets a tag of its own (:p25-egress), so no live tag
# moves; the project name gives the three networks copies of their own (bb2dash-p25egress_*), so no
# live network is joined. The clients run `sleep infinity` after their entrypoint has raised the
# firewall: no runner or worker starts, so nothing logs in anywhere. SECRETS_DIR points at a scratch
# folder of fake files (run-e2e.sh writes them): a DSN whose host is a real pooler name, which the
# firewall resolves and pins and nothing ever logs in to, and made-up strings for the rest.
services:
  egress:
    image: bb2dash-egress:p25-egress
    dns: [10.250.30.53]
    networks:
      - dnslog-net
    depends_on:
      dnslog:
        condition: service_started
  workspace:
    image: bb2dash-workspace:p25-egress
    command: ["sleep", "infinity"]
    restart: "no"
    healthcheck:
      disable: true
  apply:
    image: bb2dash-apply:p25-egress
    command: ["sleep", "infinity"]
    restart: "no"
    healthcheck:
      disable: true
  workspace-ingest:
    image: bb2dash-workspace-ingest:p25-egress
    command: ["sleep", "infinity"]
    restart: "no"
    healthcheck:
      disable: true

  # Review fix HIGH A (25a): a resolver that logs every query, as egress's only upstream. egress's
  # Docker resolver forwards every name it does not know itself to 10.250.30.53, so a lookup Squid
  # makes for a refused name would show in `docker compose logs dnslog`. E2e only: the live egress
  # uses Docker's resolver as compose.yaml leaves it.
  dnslog:
    image: coredns/coredns:1.11.3
    command: ["-conf", "/etc/coredns/Corefile"]
    volumes:
      - ./docker/egress/e2e/Corefile:/etc/coredns/Corefile:ro
    networks:
      dnslog-net:
        ipv4_address: 10.250.30.53

networks:
  dnslog-net:
    ipam:
      config:
        - subnet: 10.250.30.0/24
